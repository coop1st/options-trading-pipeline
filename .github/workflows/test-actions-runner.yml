name: TEST - Actions runner capability check

# Throwaway diagnostic workflow, not the production pipeline. Empirically
# checks whether GitHub's hosted ubuntu-latest runner can (a) fetch a
# yfinance options chain -- both with yfinance's default curl_cffi backend
# and with the YF_DISABLE_CURL_CFFI=1 fallback the Stocks project needed in
# a different cloud sandbox -- and (b) read the Stocks project's public
# stock_price_ledger.csv via raw.githubusercontent.com. Findings go into
# the sub-project 2 design spec; this workflow gets deleted afterward.

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yfinance
        run: pip install yfinance

      - name: Test 1 - options chain fetch, default curl_cffi backend
        continue-on-error: true
        run: |
          python3 -c "
          import yfinance as yf
          tk = yf.Ticker('AAPL')
          exps = tk.options
          print('expirations:', exps[:5])
          chain = tk.option_chain(exps[0])
          print('calls:', len(chain.calls), 'puts:', len(chain.puts))
          print('columns:', list(chain.calls.columns))
          print('RESULT: default backend WORKS')
          "

      - name: Test 2 - options chain fetch, YF_DISABLE_CURL_CFFI=1 fallback
        continue-on-error: true
        env:
          YF_DISABLE_CURL_CFFI: "1"
        run: |
          python3 -c "
          import yfinance as yf
          tk = yf.Ticker('MSFT')
          exps = tk.options
          print('expirations:', exps[:5])
          chain = tk.option_chain(exps[0])
          print('calls:', len(chain.calls), 'puts:', len(chain.puts))
          print('RESULT: YF_DISABLE_CURL_CFFI=1 fallback WORKS')
          "

      - name: Test 3 - read Stocks ledger via raw.githubusercontent.com
        continue-on-error: true
        run: |
          curl -sf "https://raw.githubusercontent.com/coop1st/stocks-research-pipeline/main/data/github_sync/daytrade_ledger/stock_price_ledger.csv" -o ledger.csv
          echo "RESULT: ledger fetch exit code $?"
          head -5 ledger.csv
          wc -l ledger.csv

      - name: Summary
        run: echo "See individual step outcomes above -- continue-on-error means all three tests run regardless of earlier failures."
