name: Options snapshot fetch

# Runs entirely in the cloud -- no local machine needed. Fetches options
# chains for the current watchlist and commits the result as a small dated
# CSV. When this workflow finishes, score-and-screen.yml runs; once the
# day's close snapshot exists it scores the day.
#
# Three snapshots a day (since 17 Nov 2026):
#   mid       about 14:10 New York   started on time by the cloud routine
#                                    "Options preclose dispatch" (this file,
#                                    session=mid). The fallback for pricing.
#   preclose  about 15:10 New York   started by the same routine
#                                    (options-preclose-fetch.yml). The one
#                                    trades are priced from.
#   close     after 16:00 New York   this file's schedule. Marks the day as
#                                    over and sets off the scoring.
# The old scheduled open and midday fetches were removed: GitHub started
# them hours late, after the market had shut, so they were never usable.
#
# A session started at the wrong time of day for its name is skipped
# (cloud/fetch_options_snapshot.py, wrong_time_reason), as are holidays
# and a snapshot that already exists. force=true overrides all of that.

run-name: "Options snapshot fetch (${{ inputs.session || 'close' }})"

on:
  schedule:
    # Both are the close fetch: 16:20 New York in summer and in winter
    # respectively. The one that fires before 16:00 New York is skipped,
    # and the later one is a backup that skips if the file exists.
    - cron: "20 20 * * 1-5"
    - cron: "20 21 * * 1-5"
  workflow_dispatch:
    inputs:
      session:
        description: "Session to fetch (mid, close)"
        required: true
        default: "close"
      force:
        description: "Fetch now even at the wrong time of day, on a holiday, or over an existing file"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Determine session
        id: session
        env:
          DISPATCH_SESSION: ${{ github.event.inputs.session }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "session=$DISPATCH_SESSION" >> "$GITHUB_OUTPUT"
          else
            echo "session=close" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch options snapshot
        env:
          # Scheduled runs and plain hand starts skip holidays/weekends, an
          # existing non-empty file and a wrong time of day; only
          # force=true overrides.
          OPTIONS_SNAPSHOT_FORCE: ${{ inputs.force == true && '1' || '' }}
        run: python cloud/fetch_options_snapshot.py ${{ steps.session.outputs.session }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/github_sync/options_snapshots/ data/github_sync/snapshot_times/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Options snapshot: ${{ steps.session.outputs.session }} $(TZ=America/New_York date +%Y-%m-%d)"
            # Another workflow can push between our checkout and this push
            # (lost the 2026-10-15 open snapshot), so rebase and retry.
            for attempt in 1 2 3 4 5; do
              git push && exit 0
              echo "Push rejected (attempt $attempt); rebasing onto origin and retrying"
              sleep $((attempt * 5))
              git pull --rebase origin "${GITHUB_REF_NAME}"
            done
            echo "::error::Push failed after 5 attempts"
            exit 1
          fi
